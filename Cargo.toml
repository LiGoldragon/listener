[package]
name         = "listener"
version      = "0.17.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/listener"
description  = "Listener speech-to-text CLI and supervised daemon scaffold."
publish      = false

[lib]
name = "listener"
path = "src/lib.rs"

[[bin]]
name = "listener"
path = "src/main.rs"
required-features = ["nota-text"]

[[bin]]
name = "listener-daemon"
path = "src/bin/listener_daemon.rs"

[[bin]]
name = "listener-recall"
path = "src/bin/listener_recall.rs"

[[bin]]
name = "listener-transcription-customization"
path = "src/bin/listener_transcription_customization.rs"

[[bin]]
name = "meta-listener"
path = "src/bin/meta_listener.rs"
required-features = ["nota-text"]

[features]
default = ["nota-text"]
nota-text = ["dep:nota", "signal-frame/nota-text", "signal-listener/nota-text", "meta-signal-listener/nota-text"]

[dependencies]
crc32fast            = "1"
fs2                  = "0.4"
meta-signal-listener = { git = "https://github.com/LiGoldragon/meta-signal-listener.git", branch = "listener-wispr-01a04e75", default-features = false }
kameo                = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01", default-features = false, features = ["macros"] }
nota                 = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "7d0651a0e098efea5fe2578cb06d88e009d40ff0", optional = true }
reqwest              = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rkyv                 = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine          = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "93a6b5f063292e000a7bf395fdd5b46e3e943068" }
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
signal-frame         = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "f46872e7e8edae5264c892443d415a273b231234", default-features = false }
signal-listener      = { git = "https://github.com/LiGoldragon/signal-listener.git", rev = "b44a9e7a2161e1fd77df6ecde64bb824f2dd2069", default-features = false }
thiserror            = "2"
tokio                = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
zbus                 = "4.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
