[package]
name = "listener-entry"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
datom-codec.workspace = true
rkyv.workspace = true
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
listener-place = { path = "../listener-place", features = ["datom"] }
listener-library = { workspace = true, features = ["datom"] }
listener-emission = { path = "../listener-emission" }
meta-signal-listener = { workspace = true, features = ["datom"] }
nexus.workspace = true
nexus-client = { git = "https://github.com/LiGoldragon/nexus", rev = "681a99ba307acd9cce6d5c120846072f1cedd814" }
rustix.workspace = true
serde_json = "1"
signal = { workspace = true, features = ["datom"] }
signal-listener = { workspace = true, features = ["datom"] }
tokio.workspace = true
translator = { workspace = true, default-features = false, features = ["datom"] }
translator-runtime = { git = "https://github.com/LiGoldragon/translator", rev = "cb4f6f4e5b3ef07f41d749e669dda58a6bcbf585" }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio"] }
