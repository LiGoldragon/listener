[package]
name = "listener-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/listener"
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "listener-library/datom", "signal-listener/datom", "meta-signal-listener/datom"]

[dependencies]
listener-library = { git = "https://github.com/LiGoldragon/listener-library", rev = "5dbc60f59084a388bb0348d528b3da92bf53aedd", default-features = false }
signal-listener = { git = "https://github.com/LiGoldragon/signal-listener", rev = "5052fd8f5d3c1609431dc75d6f85306a1c3a5e18", default-features = false }
meta-signal-listener = { git = "https://github.com/LiGoldragon/meta-signal-listener", rev = "e9d2730eb0aef21371a53516a8dca88a9988853c", default-features = false }
memory = { git = "https://github.com/LiGoldragon/memory", rev = "e78519c2fc8f213246328bf28f9e38f9a216f76e" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }

tempfile = "3"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "2999292dc67c8608e54d32c333c550b29153cbff" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
