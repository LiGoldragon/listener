[package]
name = "listener-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/listener"
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "listener-library/datom", "signal-listener/datom", "meta-signal-listener/datom"]

[dependencies]
listener-library = { git = "https://github.com/LiGoldragon/listener-library", rev = "d0f571a18e0aa5fb8ecd6454fc5bf813a52edf96", default-features = false }
signal-listener = { git = "https://github.com/LiGoldragon/signal-listener", rev = "5e588a2e975ff80781ab9411779281f1fc63d109", default-features = false }
meta-signal-listener = { git = "https://github.com/LiGoldragon/meta-signal-listener", rev = "0cf47f03e4c99ab424f5db6171875dd9f929161a", default-features = false }
memory = { git = "https://github.com/LiGoldragon/memory", rev = "e78519c2fc8f213246328bf28f9e38f9a216f76e" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }

tempfile = "3"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "2999292dc67c8608e54d32c333c550b29153cbff" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
